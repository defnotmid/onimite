name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The build reads ovg, oglyph, ocurves, oksl, odecs, ottis, o3d and odawg through
# `-collection:deps=..`, so every job checks the nine repositories out side by side, each at its
# pinned tag (ci.sh pins checks every checkout names one):
#   $GITHUB_WORKSPACE/{onimite,ovg,oglyph,ocurves,oksl,odecs,ottis,o3d,odawg}
# The build, test and smoke steps are .github/ci.sh, the same on every OS.
#
# third_party/fetch.sh is not run: it fetches only the fframes reference
# checkout for tools/bench.sh. Nothing in the build or the tests reads
# third_party/; Lua, Box2D and SDL3 come from Odin's
# vendor packages (set up by .github/actions/setup-toolchain).

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted: free for public repositories, and a fresh machine for
        # every run (pull requests from forks never reach the org's own Mac).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Hosted runners have no GPU: the GPU tests log "skipped". A hang fails fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: onimite
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/ovg
          path: ovg
          ref: v0.0.46
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/ocurves
          # Pinned like ovg and o3d, which keep their paths and shapes in its contour tables (both on v0.0.4).
          ref: v0.0.4
          path: ocurves
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/oglyph
          # Pinned like ovg: fonts, font collections, text shaping, bidi and line breaks, which ovg draws through (v0.0.10; ovg v0.0.46 needs it).
          ref: v0.0.10
          path: oglyph
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/oksl
          # Pinned like o3d, whose shaders and onimite's it compiles (v0.0.2).
          ref: v0.0.2
          path: oksl
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/odecs
          # Pinned like ottis: onimite, ovg v0.0.46, o3d v0.0.41, odawg v0.0.43 and ottis v0.0.8 decode through odecs v0.0.13.
          ref: v0.0.13
          path: odecs
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/ottis
          # Pinned: ottis is released on its own; a new tag is taken on purpose.
          ref: v0.0.8
          path: ottis
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/o3d
          # Pinned like ottis: o3d is released on its own (v0.0.41).
          ref: v0.0.41
          path: o3d
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/odawg
          # Pinned like ottis: odawg is released on its own (v0.0.43).
          ref: v0.0.43
          path: odawg

      - uses: ./onimite/.github/actions/setup-toolchain

      - name: No heavy media committed
        if: matrix.os == 'ubuntu-latest'
        run: bash onimite/.github/ci.sh media
      - name: No measured loudness in example READMEs
        if: matrix.os == 'ubuntu-latest'
        run: bash onimite/.github/ci.sh readmes
      - name: Every sibling at a pinned tag
        if: matrix.os == 'ubuntu-latest'
        run: bash onimite/.github/ci.sh pins
      - name: Benchmark facts measure the latest release
        if: matrix.os == 'ubuntu-latest'
        run: bash onimite/.github/ci.sh facts
      - name: Build
        run: bash onimite/.github/ci.sh build
      - name: Test
        run: bash onimite/.github/ci.sh test
      - name: Smoke test (software renderer)
        run: bash onimite/.github/ci.sh smoke
      # once: it fetches the examples' sample sets
      - name: Example songs unchanged
        if: matrix.os == 'ubuntu-latest'
        run: bash onimite/.github/ci.sh songs

  # Best effort until the Windows build is verified on real hardware: Odin
  # ships SDL3.dll and lua54.dll, but nobody has built or run onimite on
  # Windows yet, so a failure here does not fail the workflow.
  windows:
    name: test (windows-latest, best effort)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: onimite
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/ovg
          path: ovg
          ref: v0.0.46
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/ocurves
          # Pinned like ovg and o3d, which keep their paths and shapes in its contour tables (both on v0.0.4).
          ref: v0.0.4
          path: ocurves
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/oglyph
          # Pinned like ovg: fonts, font collections, text shaping, bidi and line breaks, which ovg draws through (v0.0.10; ovg v0.0.46 needs it).
          ref: v0.0.10
          path: oglyph
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/oksl
          # Pinned like o3d, whose shaders and onimite's it compiles (v0.0.2).
          ref: v0.0.2
          path: oksl
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/odecs
          # Pinned like ottis: onimite, ovg v0.0.46, o3d v0.0.41, odawg v0.0.43 and ottis v0.0.8 decode through odecs v0.0.13.
          ref: v0.0.13
          path: odecs
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/ottis
          # Pinned: ottis is released on its own; a new tag is taken on purpose.
          ref: v0.0.8
          path: ottis
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/o3d
          # Pinned like ottis: o3d is released on its own (v0.0.41).
          ref: v0.0.41
          path: o3d
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/odawg
          # Pinned like ottis: odawg is released on its own (v0.0.43).
          ref: v0.0.43
          path: odawg

      - uses: ./onimite/.github/actions/setup-toolchain

      - name: Build
        run: bash onimite/.github/ci.sh build
      - name: Test
        run: bash onimite/.github/ci.sh test
      - name: Smoke test (software renderer)
        run: bash onimite/.github/ci.sh smoke
